<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thailand-address demo: redesign prototype</title>
<!--
  Static redesign prototype for thailand-address-demo.farzai.com. Not production code.
  ?page=home|example|reference &lang=th|en &theme=light|dark &annot=1
  Site chrome only. The <AddressForm> shown is drawn to match the shipped registry
  component with shadcn defaults; it is not restyled.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* shadcn neutral, unchanged */
    --background: oklch(1 0 0); --foreground: oklch(0.145 0 0);
    --muted: oklch(0.97 0 0); --muted-foreground: oklch(0.50 0 0);
    --border: oklch(0.922 0 0); --input: oklch(0.922 0 0); --ring: oklch(0.708 0 0);
    --primary: oklch(0.205 0 0); --primary-foreground: oklch(0.985 0 0);
    /* the one site accent: links, current nav, active tab rule, focus ring on site chrome */
    --accent-site: oklch(0.48 0.09 190);
    --code-bg: oklch(0.975 0 0);
    --radius: 0.625rem;
  }
  .dark {
    --background: oklch(0.155 0 0); --foreground: oklch(0.97 0 0);
    --muted: oklch(0.225 0 0); --muted-foreground: oklch(0.72 0 0);
    --border: oklch(1 0 0 / 9%); --input: oklch(1 0 0 / 14%); --ring: oklch(0.556 0 0);
    --primary: oklch(0.922 0 0); --primary-foreground: oklch(0.205 0 0);
    --accent-site: oklch(0.78 0.09 190);
    --code-bg: oklch(0.19 0 0);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--background); color: var(--foreground); }
  body { font-family: "IBM Plex Sans Thai", ui-sans-serif, system-ui, sans-serif; font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted-foreground); }

  /* ---- chrome ---- */
  .top { height: 64px; display: flex; align-items: center; justify-content: space-between; max-width: 1120px; margin: 0 auto; padding: 0 32px; }
  .brand { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; text-decoration: none; display: flex; align-items: center; gap: 10px; }
  .brand i { width: 8px; height: 8px; border-radius: 2px; background: var(--accent-site); display: inline-block; }
  .toplinks { display: flex; align-items: center; gap: 28px; font-size: 14px; }
  .toplinks a { text-decoration: none; color: var(--muted-foreground); }
  .toplinks a.on { color: var(--foreground); }
  .tool { display: inline-flex; align-items: center; justify-content: center; height: 32px; min-width: 32px; padding: 0 8px; border-radius: 8px; font-size: 13px; color: var(--muted-foreground); border: 0; background: none; font-family: inherit; }
  .burger { display: none; }

  /* ---- home ---- */
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 32px; }
  .hero { padding: 72px 0 40px; max-width: 760px; min-width: 0; }
  h1 { font-size: 40px; line-height: 1.25; font-weight: 600; letter-spacing: -0.02em; }
  .lead { margin-top: 16px; font-size: 18px; line-height: 1.7; color: var(--muted-foreground); max-width: 60ch; }
  .install { min-width: 0; margin-top: 28px; display: flex; align-items: center; gap: 12px; background: var(--code-bg); border-radius: var(--radius); padding: 10px 10px 10px 16px; font-size: 13px; max-width: 680px; }
  .install code { flex: 1; min-width: 0; overflow-x: auto; -webkit-mask-image: linear-gradient(90deg,#000 88%,transparent); mask-image: linear-gradient(90deg,#000 88%,transparent); white-space: nowrap; scrollbar-width: none; }
  .install code b { font-weight: 400; color: var(--muted-foreground); }
  .copy { flex: none; height: 28px; padding: 0 10px; border-radius: 6px; border: 0; background: var(--background); color: var(--foreground); font: 500 12px/1 "IBM Plex Sans Thai", sans-serif; box-shadow: 0 0 0 1px var(--border); }

  .demo > * { min-width: 0; } .demo { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 64px; padding: 24px 0 96px; }
  .modes { display: flex; gap: 24px; font-size: 14px; border-bottom: 1px solid var(--border); margin-bottom: 32px; }
  .modes a { text-decoration: none; padding: 10px 0; color: var(--muted-foreground); margin-bottom: -1px; border-bottom: 2px solid transparent; white-space: nowrap; }
  .modes a.on { color: var(--foreground); border-bottom-color: var(--accent-site); }

  /* the shipped component, drawn with shadcn defaults (not restyled) */
  fieldset { border: 0; display: grid; gap: 20px; }
  legend { font-weight: 500; font-size: 16px; margin-bottom: 16px; }
  .field { display: grid; gap: 8px; align-content: start; }
  .field label, .lab { font-size: 14px; font-weight: 500; line-height: 1; }
  .in { height: 36px; border: 1px solid var(--input); border-radius: 8px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; background: transparent; box-shadow: 0 1px 2px rgb(0 0 0 / .04); }
  .dark .in { background: oklch(1 0 0 / 4%); }
  .in.ph { color: var(--muted-foreground); }
  .in.dis { opacity: .5; }
  .in.w { width: 132px; }
  .desc { font-size: 13px; color: var(--muted-foreground); line-height: 1.5; }
  .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .host { padding-bottom: 24px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
  .host .desc { display: flex; gap: 6px; align-items: center; }
  .host .desc i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--muted-foreground); display: inline-block; }
  .submit { display: flex; justify-content: flex-end; margin-top: 8px; }
  .btn { height: 36px; padding: 0 16px; border-radius: 8px; background: var(--primary); color: var(--primary-foreground); font: 500 14px/1 "IBM Plex Sans Thai", sans-serif; border: 0; }
  .try { margin-top: 20px; font-size: 14px; color: var(--muted-foreground); display: flex; gap: 6px 16px; flex-wrap: wrap; }
  .try a { color: var(--foreground); text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 4px; }

  .out { position: sticky; top: 24px; align-self: start; }
  .outhead { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; margin-bottom: 12px; }
  .outhead .fmt { display: flex; gap: 14px; }
  .outhead .fmt a { text-decoration: none; color: var(--muted-foreground); }
  .outhead .fmt a.on { color: var(--foreground); text-decoration: underline; text-decoration-color: var(--accent-site); text-decoration-thickness: 2px; text-underline-offset: 6px; }
  pre { max-width: 100%; font: 13px/1.75 "IBM Plex Mono", monospace; background: var(--code-bg); border-radius: var(--radius); padding: 18px 20px; overflow-x: auto; }
  pre .k { color: var(--muted-foreground); } pre .n { color: var(--muted-foreground); }
  .outnote { margin-top: 12px; font-size: 13px; color: var(--muted-foreground); }

  .foot { border-top: 1px solid var(--border); padding: 28px 0 48px; font-size: 13px; color: var(--muted-foreground); display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .foot a { color: var(--muted-foreground); }
  .foot .links { display: flex; gap: 20px; flex-wrap: wrap; }

  /* ---- docs layout ---- */
  .docs { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 72px; padding: 40px 0 96px; }
  .side { position: sticky; top: 24px; align-self: start; font-size: 14px; }
  .side h4 { font-size: 12px; font-weight: 500; color: var(--muted-foreground); margin: 24px 0 6px; letter-spacing: .02em; }
  .side h4:first-child { margin-top: 0; }
  .side a { display: block; padding: 4px 0 4px 12px; text-decoration: none; color: var(--muted-foreground); border-left: 1px solid var(--border); }
  .side a.on { color: var(--foreground); border-left: 2px solid var(--accent-site); padding-left: 11px; }
  .doc { max-width: 720px; min-width: 0; }
  .doc h1 { font-size: 32px; }
  .doc .lead { font-size: 17px; }
  .doc h2 { font-size: 20px; font-weight: 600; margin: 56px 0 14px; letter-spacing: -0.01em; }
  .doc p, .doc li { font-size: 16px; }
  .doc ul { margin-left: 20px; display: grid; gap: 6px; }
  .doc .demo1 { margin-top: 40px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 500; font-size: 13px; color: var(--muted-foreground); padding: 0 16px 10px 0; border-bottom: 1px solid var(--border); }
  td { padding: 14px 16px 14px 0; border-bottom: 1px solid var(--border); vertical-align: top; line-height: 1.55; }
  td.p { font-family: "IBM Plex Mono", monospace; font-size: 13px; white-space: nowrap; }
  td.t { font-family: "IBM Plex Mono", monospace; font-size: 12.5px; color: var(--muted-foreground); }
  td .def { display: block; font-family: "IBM Plex Mono", monospace; font-size: 12.5px; color: var(--muted-foreground); margin-top: 4px; }
  .pager { display: flex; justify-content: space-between; margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--border); font-size: 14px; }
  .pager a { text-decoration: none; }
  .pager small { display: block; font-size: 12px; color: var(--muted-foreground); }

  /* links in prose take the accent */
  .doc a.x, .foot a.x, .outnote a { color: var(--accent-site); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }

  /* ---- annotations ---- */
  .ann { position: absolute; z-index: 9; background: #ff2bd6; color: #fff; font: 600 11.5px/1.35 Menlo, monospace; padding: 6px 8px; border-radius: 4px; width: 140px; }
  .ann::before { content: attr(data-n); display: inline-block; background: #fff; color: #ff2bd6; border-radius: 50%; width: 18px; height: 18px; text-align: center; line-height: 18px; margin-right: 6px; }
  body:not(.annot) .ann { display: none; }

  /* ---- mobile ---- */
  @media (max-width: 760px) {
    .top { padding: 0 20px; height: 56px; }
    .toplinks .hide-m { display: none; }
    .toplinks { gap: 4px; }
    .burger { display: inline-flex; }
    .wrap { padding: 0 20px; }
    .hero { padding: 32px 0 24px; }
    h1 { font-size: 30px; }
    .lead { font-size: 16px; margin-top: 12px; }
    .install { margin-top: 20px; }
    .demo { grid-template-columns: 1fr; gap: 40px; padding-top: 8px; }
    .modes { gap: 18px; overflow-x: auto; scrollbar-width: none; margin-bottom: 24px; }
    .g3 { grid-template-columns: 1fr; }
    .out { position: static; }
    .docs { grid-template-columns: 1fr; gap: 0; padding-top: 20px; }
    .side { display: none; }
    .crumb { display: flex !important; }
    .doc h1 { font-size: 28px; }
    .doc h2 { margin-top: 44px; }
    table thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tr { padding: 14px 0; border-bottom: 1px solid var(--border); }
    td { border: 0; padding: 2px 0; }
    td.p { font-size: 14px; font-weight: 500; }
  }
  .crumb { display: none; align-items: center; justify-content: space-between; font-size: 14px; color: var(--muted-foreground); padding: 10px 0 18px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
  .crumb b { font-weight: 500; color: var(--foreground); }
</style>
</head>
<body>
<div id="app"></div>
<script>
const q = new URLSearchParams(location.search);
const L = q.get('lang') === 'en' ? 'en' : 'th';
const page = q.get('page') || 'home';
if (q.get('theme') === 'dark') document.documentElement.classList.add('dark');
if (q.get('annot') === '1') document.body.classList.add('annot');
document.documentElement.lang = L;
const t = (th, en) => (L === 'th' ? th : en);

const topbar = (on) => `<header class="top">
  <a class="brand" href="#"><i aria-hidden="true"></i>thailand-address</a>
  <nav class="toplinks" aria-label="${t('เมนูหลัก','Main')}">
    <a class="hide-m ${on==='examples'?'on':''}" href="#">${t('ตัวอย่าง','Examples')}</a>
    <a class="hide-m ${on==='docs'?'on':''}" href="#">${t('เอกสาร','Docs')}</a>
    <a class="hide-m" href="#">GitHub</a>
    <button class="tool" aria-label="${t('เปลี่ยนเป็นภาษาอังกฤษ','Switch to Thai')}">${t('EN','ไทย')}</button>
    <button class="tool" aria-label="${t('ธีม','Theme')}">${document.documentElement.classList.contains('dark') ? '☀' : '☾'}</button>
    <button class="tool burger" aria-label="${t('เมนู','Menu')}">☰</button>
  </nav>
</header>`;

const form = () => `
  <div class="host field">
    <label>${t('บ้านเลขที่ ถนน ซอย','House no., street, soi')}</label>
    <div class="in"></div>
    <p class="desc"><i aria-hidden="true"></i>${t('ช่องของแอปคุณเอง ไม่ได้อยู่ในคอมโพเนนต์','Your app’s own field, not part of the component')}</p>
  </div>
  <fieldset>
    <legend>${t('ที่อยู่จัดส่ง','Shipping address')}</legend>
    <div class="field"><label>${t('รหัสไปรษณีย์','Postal code')}</label><div class="in w num">83100</div><p class="desc">✓ ${t('เติมจากรหัสไปรษณีย์ 83100','Filled from postal code 83100')}</p></div>
    <div class="g3">
      <div class="field"><label>${t('จังหวัด','Province')}</label><div class="in">${t('ภูเก็ต','Phuket')}<span class="muted">⌄</span></div></div>
      <div class="field"><label>${t('อำเภอ','District')}</label><div class="in">${t('เมืองภูเก็ต','Mueang Phuket')}<span class="muted">⌄</span></div></div>
      <div class="field"><label>${t('ตำบล','Subdistrict')}</label><div class="in">${t('กะรน','Karon')}<span class="muted">⌄</span></div></div>
    </div>
  </fieldset>
  <div class="submit"><button class="btn">${t('ส่ง','Submit')}</button></div>`;

const payload = `<pre aria-label="JSON"><span class="n">{</span>
  "shipping": {
    "province_code": "83",
    "district_code": "8301",
    "subdistrict_code": "830108",
    "postal_code": "83100"
  }
<span class="n">}</span></pre>`;

const footer = `<footer class="wrap"><div class="foot">
  <div>${t('ข้อมูลล็อกไว้ที่ snapshot','Data pinned to snapshot')} <span class="mono">2026-10-14</span> · DOPA, ${t('ไปรษณีย์ไทย','Thailand Post')}, MDES (CC-BY)</div>
  <div class="links"><a href="#">${t('คำอธิบายฟิลด์','Field docs')}</a><a href="#">schema.json</a><a href="#">llms.txt</a><a href="#">${t('แหล่งข้อมูลและสัญญาอนุญาต','Sources and licences')}</a></div>
</div></footer>`;

const A = (n, style, text) => `<div class="ann" data-n="${n}" style="${style}">${text}</div>`;

function home() {
  return `${topbar('')}
  <main class="wrap" style="position:relative">
    <section class="hero">
      <h1>${t('ฟอร์มที่อยู่ไทย ที่เริ่มจากรหัสไปรษณีย์','A Thai address form that starts from the postal code')}</h1>
      <p class="lead">${t('คอมโพเนนต์ shadcn/ui พิมพ์ 5 หลัก ที่เหลือเติมเอง ส่งออกเป็นรหัส ไม่ใช่ชื่อ','A shadcn/ui component. Type 5 digits and the rest fills in. It sends codes, not names.')}</p>
      <div class="install"><code class="mono"><b>$ </b>npx shadcn@latest add https://thailand-address-demo.farzai.com/r/address-form.json</code><button class="copy">${t('คัดลอก','Copy')}</button></div>
    </section>
    <section class="demo" aria-label="${t('ลองใช้','Try it')}">
      <div>
        <nav class="modes" aria-label="${t('รูปแบบฟอร์ม','Form modes')}"><a class="on" href="#">${t('เริ่มจากรหัสไปรษณีย์','Postal code first')}</a><a href="#">${t('เลือกพื้นที่ก่อน','Area first')}</a><a href="#">${t('ค้นหา','Search')}</a><a href="#">${t('หลายที่อยู่','Multiple')}</a></nav>
        ${form()}
        <div class="try">${t('ลองพิมพ์','Try')} <a class="num" href="#">83100</a><a class="num" href="#">10200</a><a class="num" href="#">13240</a><a class="num" href="#">10001</a><a class="num" href="#">99999</a></div>
      </div>
      <aside class="out" aria-label="${t('สิ่งที่ฟอร์มส่ง','What the form sends')}">
        <div class="outhead"><span class="muted">${t('สิ่งที่ฟอร์มส่ง','What the form sends')}</span><span class="fmt"><a class="on" href="#">JSON</a><a href="#">HTML</a><a href="#">Laravel</a></span></div>
        ${payload}
        <p class="outnote">${t('ตรวจฝั่งเซิร์ฟเวอร์ด้วย','Validate on the server with')} <a href="#">farzai/thailand-address</a></p>
      </aside>
    </section>
    ${A(1,'left:-156px;top:80px','One message on the first screen: a sentence, one line of lead, the install line. No sidebar on home.')}
    ${A(2,'left:-156px;top:230px','Install is a single quiet line: tinted bg, no border, text "Copy" button.')}
    ${A(3,'left:-156px;top:390px','Mode tabs become text with an accent underline. The form sits on the page: no outer card, no dashed box.')}
    ${A(4,'left:1078px;top:330px','Payload: no card, no tab box. Formats are three text links; it stays sticky beside the form.')}
  </main>
  ${footer}`;
}

const side = (on) => `<aside class="side"><nav aria-label="${t('เอกสาร','Docs')}">
  <h4>${t('เริ่มต้น','Start')}</h4><a href="#">${t('ติดตั้ง','Installation')}</a><a href="#">${t('ชุดข้อมูล','Dataset')}</a>
  <h4>${t('ตัวอย่าง','Examples')}</h4><a class="${on==='postal'?'on':''}" href="#">${t('เริ่มจากรหัสไปรษณีย์','Postal code first')}</a><a href="#">${t('เลือกพื้นที่ก่อน','Area first')}</a><a href="#">${t('ช่องค้นหาเดียว','Single search box')}</a><a href="#">${t('หลายที่อยู่','Multiple addresses')}</a><a href="#">${t('รหัสหน่วยงานและรหัสที่ไม่พบ','Facility and unknown codes')}</a><a href="#">react-hook-form</a>
  <h4>${t('อ้างอิง','Reference')}</h4><a class="${on==='ref'?'on':''}" href="#">&lt;AddressForm&gt;</a><a href="#">@farzai/thailand-address</a><a href="#">Laravel</a><a href="#">llms.txt</a>
</nav></aside>`;

const crumb = (here) => `<div class="crumb"><span>${here}</span><b>${t('ทุกหน้า ⌄','All pages ⌄')}</b></div>`;

function example() {
  return `${topbar('examples')}
  <main class="wrap" style="position:relative"><div class="docs">${side('postal')}
    <article class="doc">${crumb(t('ตัวอย่าง','Examples'))}
      <h1>${t('เริ่มจากรหัสไปรษณีย์','Postal code first')}</h1>
      <p class="lead">${t('รูปแบบเริ่มต้น พิมพ์ 5 หลัก ฟอร์มเติมส่วนที่เหลือ ช่องอื่นมีไว้ยืนยันหรือแก้','The default. Type 5 digits and the form fills in the rest; the other fields confirm or correct it.')}</p>
      <div class="demo1">${form()}</div>
      <h2>${t('สิ่งที่ฟอร์มส่ง','What the form sends')}</h2>
      ${payload}
      <h2>${t('ลองรหัสเหล่านี้','Try these codes')}</h2>
      <ul>
        <li><span class="mono">83100</span> · ${t('ตำบลเดียว เติมครบทุกช่อง','one subdistrict, so every field fills')}</li>
        <li><span class="mono">10200</span> · ${t('12 แขวงในเขตพระนคร เติมจังหวัดและเขต แล้วให้เลือกแขวง','12 subdistricts in Phra Nakhon: province and district fill, then you pick')}</li>
        <li><span class="mono">13240</span> · ${t('2 จังหวัด เลือกจากรายการเดียว','spans 2 provinces: one combined list')}</li>
      </ul>
      <h2>${t('โค้ด','Code')}</h2>
      <pre>&lt;AddressForm name="shipping" value={shipping} onChange={setShipping} required /&gt;</pre>
      <div class="pager"><a href="#"><small>${t('ก่อนหน้า','Previous')}</small>${t('ชุดข้อมูล','Dataset')}</a><a href="#" style="text-align:right"><small>${t('ถัดไป','Next')}</small>${t('เลือกพื้นที่ก่อน','Area first')}</a></div>
    </article></div>
    ${A(5,'left:-156px;top:40px','Docs pages get the sidebar: 3 quiet groups, current page marked by an accent rule, no filled pill.')}
    ${A(6,'left:1078px;top:40px','One column, max 720px. The demo is the form alone; payload and code follow as sections.')}
  </main>
  ${footer}`;
}

const PROPS = [
  ['name','string','—',t('นำหน้าชื่อ hidden input เช่น shipping[province_code]','Prefixes the hidden inputs, e.g. shipping[province_code]')],
  ['value','AddressValue','—',t('รหัสสี่ค่า ระดับที่ยังไม่ได้เลือกเป็น null','The four codes; unset levels are null')],
