<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Thai address form: design prototype (parsilver/thailand-address-js#1)</title>
<!--
  Static design prototype. Not production code.
  Open with ?screen=<id>&lang=th|en. Screen ids are listed in SCREENS at the bottom.
  Styling copies shadcn/ui defaults (new-york style, neutral base, CSS variables) so the
  component reads as native in any shadcn app. Place names come from the current
  farzai/thailand-address PHP data; the dataset snapshot is not published yet.
-->
<style>
  :root {
    --background: oklch(1 0 0); --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0); --popover: oklch(1 0 0);
    --primary: oklch(0.205 0 0); --primary-foreground: oklch(0.985 0 0);
    --muted: oklch(0.97 0 0); --muted-foreground: oklch(0.556 0 0);
    --accent: oklch(0.97 0 0); --border: oklch(0.922 0 0); --input: oklch(0.922 0 0);
    --ring: oklch(0.708 0 0); --destructive: oklch(0.577 0.245 27.325);
    --radius: 0.625rem;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Geist, Inter, "Noto Sans Thai", Thonburi, -apple-system, sans-serif; color: var(--foreground); background: oklch(0.985 0 0); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .wrap { padding: 32px; display: grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap: 28px; align-items: start; }
  .frame { position: relative; }
  .ftitle { font-size: 12px; font-weight: 600; color: oklch(0.45 0.12 252); letter-spacing: .02em; margin-bottom: 8px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: calc(var(--radius) + 4px); padding: 24px; box-shadow: 0 1px 2px rgb(0 0 0 / .04); }
  fieldset { border: 0; display: grid; gap: 16px; }
  legend { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .field { display: grid; gap: 6px; position: relative; align-content: start; }
  label, .label { font-size: 14px; font-weight: 500; line-height: 1; }
  .desc { font-size: 13px; color: var(--muted-foreground); }
  .input, .trigger { height: 36px; width: 100%; border: 1px solid var(--input); border-radius: calc(var(--radius) - 2px); background: transparent; padding: 0 12px; font: inherit; font-size: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; box-shadow: 0 1px 2px rgb(0 0 0 / .05); color: var(--foreground); }
  .input.ph, .trigger.ph { color: var(--muted-foreground); }
  .focus { border-color: var(--ring); box-shadow: 0 0 0 3px oklch(0.708 0 0 / .5); }
  .invalid { border-color: var(--destructive); box-shadow: 0 0 0 3px oklch(0.577 0.245 27.325 / .2); }
  .disabled { opacity: .5; }
  .filled { background: oklch(0.985 0 0); }
  .chev { color: var(--muted-foreground); font-size: 11px; }
  .w-postal { width: 132px; }
  .spin { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--foreground); border-radius: 50%; }
  .note { font-size: 13px; color: var(--muted-foreground); display: flex; gap: 6px; align-items: baseline; }
  .note b { color: var(--foreground); font-weight: 500; }
  .link { font-size: 13px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; color: var(--foreground); background: none; border: 0; cursor: pointer; font-family: inherit; padding: 0; }
  .alert { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; display: grid; grid-template-columns: 16px 1fr; gap: 2px 10px; font-size: 13px; }
  .alert .t { font-weight: 500; font-size: 14px; grid-column: 2; }
  .alert .b { color: var(--muted-foreground); grid-column: 2; }
  .alert .i { grid-row: 1 / span 2; font-weight: 700; }
  .alert.destructive { color: var(--destructive); border-color: oklch(0.577 0.245 27.325 / .4); }
  .alert.destructive .b { color: oklch(0.577 0.245 27.325 / .85); }
  .pop { position: absolute; z-index: 3; left: 0; right: 0; top: calc(100% + 4px); background: var(--popover); border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px); box-shadow: 0 8px 24px rgb(0 0 0 / .1); overflow: hidden; }
  .pop .search { height: 36px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--muted-foreground); font-size: 14px; }
  .pop .grp { font-size: 12px; font-weight: 500; color: var(--muted-foreground); padding: 8px 10px 4px; }
  .pop ul { list-style: none; padding: 4px; max-height: 260px; overflow: hidden; }
  .pop li { padding: 6px 8px; border-radius: 6px; font-size: 14px; display: flex; justify-content: space-between; gap: 12px; }
  .pop li.on { background: var(--accent); }
  .pop li small { color: var(--muted-foreground); font-size: 12px; }
  .pop li mark { background: none; font-weight: 600; color: inherit; }
  .pop .empty { padding: 20px 12px; text-align: center; font-size: 13px; color: var(--muted-foreground); }
  .radios { display: grid; gap: 8px; }
  .radio { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--border); border-radius: calc(var(--radius) - 2px); padding: 10px 12px; font-size: 14px; }
  .radio .dot { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--input); margin-top: 2px; flex: none; box-shadow: 0 1px 2px rgb(0 0 0 / .05); }
  .radio.on { border-color: var(--primary); }
  .radio.on .dot { border-color: var(--primary); background: radial-gradient(circle, var(--primary) 0 3.5px, transparent 4px); }
  .radio small { display: block; color: var(--muted-foreground); font-size: 13px; }
  .radio.kb { box-shadow: 0 0 0 3px oklch(0.708 0 0 / .5); }
  .seg { display: inline-flex; border: 1px solid var(--input); border-radius: calc(var(--radius) - 2px); overflow: hidden; height: 32px; }
  .seg span { padding: 0 12px; display: flex; align-items: center; font-size: 13px; border-right: 1px solid var(--input); }
  .seg span:last-child { border-right: 0; }
  .seg span.on { background: var(--accent); font-weight: 500; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 500; }
  .box { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--primary); background: var(--primary); color: var(--primary-foreground); font-size: 11px; display: flex; align-items: center; justify-content: center; }
  .box.off { background: transparent; border-color: var(--input); }
  .summary { border: 1px dashed var(--border); border-radius: calc(var(--radius) - 2px); padding: 12px; font-size: 14px; color: var(--muted-foreground); }
  .host { outline: 1px dashed oklch(0.75 0.15 300); outline-offset: 3px; }
  .live { font: 12px/1.4 Menlo, monospace; background: oklch(0.96 0.02 252); color: oklch(0.35 0.1 252); border-radius: 6px; padding: 6px 8px; }
  .live::before { content: "aria-live: "; font-weight: 700; }
  .an { font: 11px/1.35 Menlo, monospace; background: #c026d3; color: #fff; padding: 4px 6px; border-radius: 4px; display: inline-block; max-width: 100%; }
  pre { white-space: pre-wrap; word-break: break-all; font: 12px/1.55 "Geist Mono", Menlo, monospace; background: oklch(0.205 0 0); color: oklch(0.92 0 0); border-radius: var(--radius); padding: 14px 16px; overflow: hidden; }
  pre .k { color: oklch(0.8 0.1 250); } pre .s { color: oklch(0.82 0.12 150); } pre .c { color: oklch(0.6 0 0); }
  .row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  /* mobile */
  .phone { width: 390px; border: 1px solid var(--border); border-radius: 28px; overflow: hidden; background: var(--background); position: relative; height: 760px; }
  .phone .bar { height: 44px; }
  .drawer { position: absolute; left: 0; right: 0; bottom: 0; background: var(--background); border-top-left-radius: 14px; border-top-right-radius: 14px; border-top: 1px solid var(--border); box-shadow: 0 -8px 30px rgb(0 0 0 / .15); }
  .drawer .handle { width: 48px; height: 5px; border-radius: 3px; background: var(--muted); margin: 8px auto 12px; }
  .drawer li { min-height: 48px; align-items: center; }
  .kbd { height: 220px; background: oklch(0.88 0 0); display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; }
  .kbd span { background: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  /* demo site */
  .site { display: grid; grid-template-columns: 220px 1fr; min-height: 900px; background: var(--background); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; width: 1360px; }
  .site nav { border-right: 1px solid var(--border); padding: 20px 16px; font-size: 13px; }
  .site nav h4 { font-size: 12px; font-weight: 600; margin: 16px 0 6px; }
  .site nav a { display: block; padding: 4px 8px; border-radius: 6px; color: var(--muted-foreground); text-decoration: none; }
  .site nav a.on { background: var(--accent); color: var(--foreground); font-weight: 500; }
  .site main { padding: 28px 40px; }
  .tabs { display: inline-flex; background: var(--muted); border-radius: var(--radius); padding: 3px; gap: 2px; }
  .tabs span { padding: 4px 12px; border-radius: calc(var(--radius) - 4px); font-size: 13px; color: var(--muted-foreground); }
  .tabs span.on { background: var(--background); color: var(--foreground); font-weight: 500; box-shadow: 0 1px 2px rgb(0 0 0 / .06); }
  .btn { height: 36px; padding: 0 16px; border-radius: calc(var(--radius) - 2px); background: var(--primary); color: var(--primary-foreground); font: inherit; font-size: 14px; font-weight: 500; border: 0; display: inline-flex; align-items: center; }
  .btn.outline { background: var(--background); color: var(--foreground); border: 1px solid var(--input); }
</style>
</head>
<body>
<div id="app"></div>
<script>
const q = new URLSearchParams(location.search);
const L = q.get('lang') === 'en' ? 'en' : 'th';
const screen = q.get('screen') || 'postal';
document.documentElement.lang = L;

// ---------- Copy table (mirrored in ../copy.md) ----------
const T = {
  th: {
    legendShip: 'ที่อยู่จัดส่ง', legendTax: 'ที่อยู่ใบกำกับภาษี',
    postal: 'รหัสไปรษณีย์', postalPh: 'เช่น 10200', postalDesc: 'พิมพ์ 5 หลัก ระบบจะเติมที่อยู่ให้',
    province: 'จังหวัด', provincePh: 'เลือกจังหวัด',
    district: 'อำเภอ/เขต', districtPh: 'เลือกอำเภอ/เขต', amphoe: 'อำเภอ', khet: 'เขต',
    subdistrict: 'ตำบล/แขวง', subdistrictPh: 'เลือกตำบล/แขวง', tambon: 'ตำบล', khwaeng: 'แขวง',
    chooseProvinceFirst: 'เลือกจังหวัดก่อน', chooseDistrictFirst: (k) => `เลือก${k}ก่อน`,
    searchHere: (k) => `ค้นหา${k}…`,
    autofilled: (pc) => `เติมจากรหัสไปรษณีย์ ${pc}`, undo: 'ล้าง',
    pickOne: (pc, n, k) => `รหัส ${pc} ใช้ได้ ${n} ${k} เลือก${k}ของคุณ`,
    pickArea: (pc, n) => `รหัส ${pc} ใช้ได้ ${n} พื้นที่ใน 2 จังหวัด เลือกพื้นที่ของคุณ`,
    facilityTitle: (pc) => `${pc} เป็นรหัสไปรษณีย์ของหน่วยงาน`,
    facilityBody: (note) => `${note} ใช้กับที่อยู่ทั่วไปไม่ได้ ตรวจรหัสอีกครั้ง หรือเลือกพื้นที่ด้านล่าง`,
    facilityUse: 'ใช้รหัสนี้ต่อ',
    notFoundTitle: (pc) => `ไม่พบรหัสไปรษณีย์ ${pc}`,
    notFoundBody: 'ตรวจตัวเลขอีกครั้ง หรือเลือกจังหวัด อำเภอ และตำบลด้านล่างได้เลย',
    postalForArea: 'รหัสไปรษณีย์ของพื้นที่นี้',
    postalChoice: (n) => `พื้นที่นี้มีรหัสไปรษณีย์ ${n} รหัส เลือกรหัสที่ใช้กับที่อยู่ของคุณ`,
    search: 'ค้นหาที่อยู่', searchPh: 'พิมพ์ตำบล อำเภอ จังหวัด หรือรหัสไปรษณีย์',
    searchDesc: 'พิมพ์ไทยหรืออังกฤษก็ได้ ไม่ต้องพิมพ์ ต./อ./จ.',
    searchMore: 'พิมพ์เพิ่มเพื่อให้ผลแคบลง',
    searchEmpty: (s) => `ไม่พบ “${s}”`, searchEmptyBody: 'ลองพิมพ์ชื่ออำเภอ ชื่อจังหวัด หรือรหัสไปรษณีย์ หรือกรอกเองด้านล่าง',
    fillManually: 'กรอกเอง',
    sameAs: 'ใช้ที่อยู่เดียวกับที่อยู่จัดส่ง',
    sameAsDesc: 'เลิกเลือกเพื่อกรอกที่อยู่ใบกำกับภาษีแยก ระบบจะคัดลอกที่อยู่จัดส่งมาให้แก้ต่อ',
    loading: 'กำลังโหลดข้อมูลที่อยู่…',
    errorTitle: 'โหลดข้อมูลที่อยู่ไม่สำเร็จ', errorBody: 'ตรวจการเชื่อมต่อแล้วลองอีกครั้ง ข้อมูลที่กรอกไว้ยังอยู่ครบ', retry: 'ลองอีกครั้ง',
    errMismatch: 'รหัสไปรษณีย์นี้ไม่ตรงกับตำบล/แขวงที่เลือก', errRequired: (f) => `กรุณาเลือก${f}`,
    line: 'บ้านเลขที่ ถนน ซอย', hostField: 'ช่องของแอปผู้ใช้ ไม่ใช่ส่วนของคอมโพเนนต์',
    showFacility: 'แสดงรหัสไปรษณีย์ของหน่วยงาน',
    pick: (k) => `เลือก${k}`,
  },
  en: {
    legendShip: 'Shipping address', legendTax: 'Tax invoice address',
    postal: 'Postal code', postalPh: 'e.g. 10200', postalDesc: 'Type 5 digits and we fill in the rest',
    province: 'Province', provincePh: 'Select province',
    district: 'District', districtPh: 'Select district', amphoe: 'District', khet: 'District (khet)',
    subdistrict: 'Subdistrict', subdistrictPh: 'Select subdistrict', tambon: 'Subdistrict', khwaeng: 'Subdistrict (khwaeng)',
    chooseProvinceFirst: 'Select a province first', chooseDistrictFirst: () => 'Select a district first',
    searchHere: (k) => `Search ${k.toLowerCase()}…`,
    autofilled: (pc) => `Filled from postal code ${pc}`, undo: 'Clear',
    pickOne: (pc, n) => `${pc} covers ${n} subdistricts. Pick yours.`,
    pickArea: (pc, n) => `${pc} covers ${n} areas in 2 provinces. Pick yours.`,
    facilityTitle: (pc) => `${pc} is a facility postal code`,
    facilityBody: (note) => `${note}. It isn't used for ordinary addresses. Check the code, or pick the area below.`,
    facilityUse: 'Use this code anyway',
    notFoundTitle: (pc) => `No postal code ${pc}`,
    notFoundBody: 'Check the digits, or pick the province, district and subdistrict below.',
    postalForArea: 'Postal code for this area',
    postalChoice: (n) => `This area has ${n} postal codes. Pick the one for your address.`,
    search: 'Find your address', searchPh: 'Type a subdistrict, district, province or postal code',
    searchDesc: 'Thai or English. No need to type ต./อ./จ.',
    searchMore: 'Keep typing to narrow the list',
    searchEmpty: (s) => `No match for “${s}”`, searchEmptyBody: 'Try a district, a province or a postal code, or fill the fields below yourself.',
    fillManually: 'Fill in manually',
    sameAs: 'Same as shipping address',
    sameAsDesc: 'Untick to enter a separate tax invoice address. We copy the shipping address in for you to edit.',
    loading: 'Loading address data…',
    errorTitle: "Couldn't load address data", errorBody: 'Check your connection and try again. What you entered is kept.', retry: 'Try again',
    errMismatch: "This postal code doesn't serve the selected subdistrict", errRequired: (f) => `Select a ${f.toLowerCase()}`,
    line: 'House no., street, soi', hostField: "Host app's own field, not part of the component",
    showFacility: 'Show facility postal codes',
    pick: (k) => `Select ${k.replace(/ \(.*\)/,'').toLowerCase()}`,
  },
}[L];

// ---------- Example data (real names from farzai/thailand-address 2.x data) ----------
const N = (th, en) => (L === 'th' ? th : en);
const BKK = N('กรุงเทพมหานคร', 'Bangkok');
const KHWAENG_10200 = [
  ['100101','พระบรมมหาราชวัง','Phra Borom Maha Ratchawang'],['100102','วังบูรพาภิรมย์','Wang Burapha Phirom'],
  ['100103','วัดราชบพิธ','Wat Ratchabophit'],['100104','สำราญราษฎร์','Samran Rat'],['100105','ศาลเจ้าพ่อเสือ','San Chao Pho Suea'],
  ['100106','เสาชิงช้า','Sao Chingcha'],['100107','บวรนิเวศ','Bowon Niwet'],['100108','ตลาดยอด','Talat Yot'],
  ['100109','ชนะสงคราม','Chana Songkhram'],['100110','บ้านพานถม','Ban Phan Thom'],['100111','บางขุนพรหม','Bang Khun Phrom'],['100112','วัดสามพระยา','Wat Sam Phraya'],
];
const AREAS_13240 = [
  [N('บ้านแพรก','Ban Phraek'), N('อ.บ้านแพรก','Ban Phraek'), N('พระนครศรีอยุธยา','Phra Nakhon Si Ayutthaya')],
  [N('บ้านใหม่','Ban Mai'), N('อ.บ้านแพรก','Ban Phraek'), N('พระนครศรีอยุธยา','Phra Nakhon Si Ayutthaya')],
  [N('สำพะเนียง','Sam Phaniang'), N('อ.บ้านแพรก','Ban Phraek'), N('พระนครศรีอยุธยา','Phra Nakhon Si Ayutthaya')],
  [N('คลองน้อย','Khlong Noi'), N('อ.บ้านแพรก','Ban Phraek'), N('พระนครศรีอยุธยา','Phra Nakhon Si Ayutthaya')],
  [N('สองห้อง','Song Hong'), N('อ.บ้านแพรก','Ban Phraek'), N('พระนครศรีอยุธยา','Phra Nakhon Si Ayutthaya')],
  [N('โก่งธนู','Kong Thanu'), N('อ.เมืองลพบุรี','Mueang Lop Buri'), N('ลพบุรี','Lop Buri')],
];

// ---------- Building blocks ----------
const input = (val, cls = '', extra = '') => `<div class="input ${val ? '' : 'ph'} ${cls}">${val || extra}</div>`;
const trigger = (val, ph, cls = '') => `<div class="trigger ${val ? '' : 'ph'} ${cls}"><span>${val || ph}</span><span class="chev">▾</span></div>`;
function field(id, label, control, opts = {}) {
  return `<div class="field">${opts.ann ? `<span class="an">${opts.ann}</span>` : ''}<label for="${id}">${label}</label>${control}${opts.desc ? `<p class="desc">${opts.desc}</p>` : ''}${opts.err ? `<p class="desc" style="color:var(--destructive)">${opts.err}</p>` : ''}${opts.pop || ''}</div>`;
}
function postalRow(val, opts = {}) {
  const inner = val ? `<span class="num">${val}</span>${opts.spin ? '<span class="spin"></span>' : ''}` : '';
  return `<div class="field"><label for="postal">${T.postal}</label>
    <div class="row"><div class="w-postal">${val ? `<div class="input ${opts.cls || ''}">${inner}</div>` : `<div class="input ph ${opts.cls || ''}">${T.postalPh}</div>`}</div>
    ${opts.note || ''}</div>${opts.desc === false ? '' : `<p class="desc">${opts.descText || T.postalDesc}</p>`}</div>`;
}
const areaGrid = (p, d, s, o = {}) => `<div class="grid3">
  ${field('province', T.province, trigger(p, T.provincePh, o.pc || (p ? 'filled' : '')), { pop: o.ppop })}
  ${field('district', o.dl || T.district, trigger(d, o.dl ? T.pick(o.dl) : T.districtPh, (o.dc || '') + (d ? ' filled' : '') + (p ? '' : ' disabled')), { desc: p ? '' : T.chooseProvinceFirst, pop: o.dpop })}
  ${field('subdistrict', o.sl || T.subdistrict, trigger(s, o.sl ? T.pick(o.sl) : T.subdistrictPh, (o.sc || '') + (s ? ' filled' : '') + (d ? '' : ' disabled')), { desc: d ? (o.sdesc || '') : (o.sdisabledDesc ?? T.chooseDistrictFirst(o.dl || T.district)), err: o.serr, pop: o.spop })}
</div>`;
const legend = (t) => `<legend>${t}</legend>`;
const card = (inner) => `<div class="card"><fieldset>${inner}</fieldset></div>`;
const frame = (title, inner, style = '') => `<section class="frame" style="${style}"><div class="ftitle">${title}</div>${inner}</section>`;
const live = (t) => `<div class="live">${t}</div>`;

// ---------- Screens ----------
const S = {};

S.postal = () => `<div class="wrap">
