name: Release

# Publishes packages/core to npm when a v* tag is pushed, e.g. v0.1.0.
# The tag must equal packages/core/package.json's version.
#
# Two jobs, so the publish credential is never in reach of dev dependencies:
# `build` installs, tests and packs with no id-token and no secret; `publish`
# runs nothing from node_modules and only publishes the packed tarball.
#
# Auth today is the NPM_TOKEN secret, read in the `npm` environment. Before
# the first tag, the repo owner should create that environment (deployment
# tags v*), keep a granular package-scoped NPM_TOKEN there, and add tag and
# main rulesets. To move to npm Trusted Publishing: add this repo and
# release.yml as a trusted publisher on npmjs.com, then delete the
# NODE_AUTH_TOKEN line below. id-token: write is already granted for it.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the package version
        working-directory: packages/core
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "::error::tag $TAG does not match packages/core version $version"
            exit 1
          fi
      - run: pnpm --filter @farzai/thailand-address check:types-generated
      - run: pnpm --filter @farzai/thailand-address test
      - run: pnpm --filter @farzai/thailand-address build
      # The same script ci.yml runs on every PR, so this step is never untested.
      - name: Pack
        run: bash scripts/pack-core.sh "$RUNNER_TEMP/pkg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/pkg/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: pkg
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish pkg/*.tgz --provenance --access public
