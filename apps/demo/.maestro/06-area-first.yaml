# Area first: levels disabled with reasons; เกาะแก้ว offers 83000/83200 with nothing chosen; province change clears below.
url: ${BASE}
name: area-first
---
- openLink: ${BASE}/examples/area-first
- scrollUntilVisible: { element: "เลือกจังหวัดก่อน", timeout: 20000, centerElement: true }
- assertVisible: "เลือกอำเภอ/เขตก่อน"
- scrollUntilVisible: { element: "เลือกจังหวัด", timeout: 10000 }
- tapOn: "เลือกจังหวัด"
- inputText: "ภูเก็ต"
- pressKey: Enter
- scrollUntilVisible: { element: "เลือกอำเภอ", timeout: 10000 }
- tapOn: "เลือกอำเภอ"
- inputText: "เมืองภูเก็ต"
- pressKey: Enter
- scrollUntilVisible: { element: "เลือกตำบล", timeout: 10000 }
- tapOn: "เลือกตำบล"
- inputText: "เกาะแก้ว"
- pressKey: Enter
- scrollUntilVisible: { element: "รหัสไปรษณีย์ของพื้นที่นี้", timeout: 10000 }
- scrollUntilVisible: { element: "83000", timeout: 5000 }
- assertVisible: "83200"
- scrollUntilVisible: { element: '.*"subdistrict_code": "830103",\s*"postal_code": null.*', timeout: 15000 }
- takeScreenshot: 06-area-kohkaew
- tapOn: "83200"
- scrollUntilVisible: { element: '.*"subdistrict_code": "830103",\s*"postal_code": "83200".*', timeout: 5000 }
- tapOn: { id: "demo-province" }
- inputText: "กระบี่"
- pressKey: Enter
- scrollUntilVisible: { element: '.*"province_code": "81",\s*"district_code": null,\s*"subdistrict_code": null,\s*"postal_code": null.*', timeout: 10000 }
- takeScreenshot: 06-area-cleared
