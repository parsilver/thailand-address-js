- assertVisible: "กรุงเทพมหานคร"
- assertVisible: "พระนคร"
- assertVisible: "เลือกแขวง"
- assertNotVisible: "Suggestions"
- scrollUntilVisible: { element: '.*"province_code": "10".*"district_code": "1001".*"subdistrict_code": null.*"postal_code": "10200".*', timeout: 15000 }
- takeScreenshot: 02-postal-10200
- tapOn: "เลือกแขวง"
- extendedWaitUntil: { visible: "พระบรมมหาราชวัง", timeout: 5000 }
