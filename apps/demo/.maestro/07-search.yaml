- scrollUntilVisible: { element: '.*"subdistrict_code": "830108",\s*"postal_code": "83100".*', timeout: 10000 }
- takeScreenshot: 07-search-karon
- scrollUntilVisible: { direction: UP, element: "ค้นหาที่อยู่", timeout: 10000, centerElement: true }
- tapOn: "ค้นหาที่อยู่"
- eraseText: 40
